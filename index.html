<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>F&C Tech Quick Shop</title>
    <link href="ico.ico" rel="icon" type="image/x-icon" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <h1>F&C Tech Quick Shop</h1>
      </div>
    </header>

    <main class="container">
      <p class="note">
        Click <strong>Buy</strong> to message the seller directly on Messenger.
      </p>

      <div class="grid" id="productGrid"></div>
    </main>

    <footer>
      Seller contact:
      <a
        href="https://www.facebook.com/profile.php?id=61564956483389"
        target="_blank"
        >facebook.com/profile.php?id=61564956483389</a
      >
      <br />© 2025 F&C Tech. All rights reserved.
    </footer>

<script>
  const FB_PAGE_ID = "61564956483389";

  const products = [
    {
      id: 1,
      name: "Microsoft Office 2024 Professional Plus — Lifetime Activation",
      price: 250,
      image: "./2024.png",
      description:
        "Affordable one-time installation service for Microsoft Office 2024 Professional.",
    },

    {
      id: 2,
      name: "Microsoft Office 2021 Professional Plus — Lifetime Activation",
      price: 200,
      image: "./2021.png",
      description:
        "Affordable one-time installation service for Microsoft Office 2021 Professional.",
    },

    {
      id: 3,
      name: "Vivo Y11 (1906) Software Recovery Service",
      price: 350,
      image: "./vivo y11 1906.jpeg",
      description:
        "Software troubleshooting and recovery service for Vivo Y11 devices.",
    },
  ];

  const grid = document.getElementById("productGrid");

  function buildCard(p) {
    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="thumb">
        <img src="${p.image}" alt="${p.name}" />
      </div>

      <div class="card-body">
        <div class="title">${p.name}</div>

        <p class="desc">${p.description}</p>

        <div class="price">₱${p.price.toLocaleString()}</div>

        <div class="row">
          <label
            for="qty-${p.id}"
            style="font-size:13px;color:var(--muted)"
          >
            Qty
          </label>

          <input
            id="qty-${p.id}"
            type="number"
            min="1"
            value="1"
          />
        </div>

        <button class="buy" data-id="${p.id}">
          Buy — Message Seller
        </button>
      </div>
    `;

    return card;
  }

  // render products
  products.forEach((p) => {
    grid.appendChild(buildCard(p));
  });

  // safer Messenger open
  grid.addEventListener("click", async (ev) => {
    const btn = ev.target.closest("button.buy");

    if (!btn) return;

    const id = Number(btn.dataset.id);

    const product = products.find((x) => x.id === id);

    if (!product) return;

    const qtyEl = document.getElementById(`qty-${id}`);

    const qty = Math.max(1, parseInt(qtyEl.value || "1"));

    const message =
      `Hello! I'm interested in buying:\n\n` +
      `${product.name}\n` +
      `Price: ₱${product.price}\n` +
      `Quantity: ${qty}`;

    // copy message to clipboard
    try {
      await navigator.clipboard.writeText(message);

      alert(
        "Message copied!\n\nMessenger will open.\nPaste the message to seller."
      );
    } catch (err) {
      console.log("Clipboard copy failed.");
    }

    // fixed Messenger URL
    const messengerUrl =
      `https://www.facebook.com/messages/t/${FB_PAGE_ID}`;

    window.open(messengerUrl, "_blank");
  });
</script>
  </body>
</html>
