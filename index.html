<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>F&C Tech Quick Shop</title>
    <link href="ico.ico" rel="icon" type="image/x-icon" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <h1>F&C Tech Quick Shop</h1>
      </div>
    </header>

    <main class="container">
      <p class="note">
        Click <strong>Buy</strong> to message the seller directly on Messenger.
      </p>

      <div class="grid" id="productGrid"></div>
    </main>

    <footer>
      Seller contact:
      <a
        href="https://www.facebook.com/profile.php?id=61564956483389"
        target="_blank"
        >facebook.com/profile.php?id=61564956483389</a
      >
      <br />© 2025 F&C Tech. All rights reserved.
    </footer>

<script>
  const FB_PAGE_ID = "61564956483389";

  const products = [
    {
      id: 1,
      name: "Microsoft Office 2024 Professional Plus",
      price: 250,
      image: "./2024.png",
      description: "Installation service for Office 2024.",
    },
    {
      id: 2,
      name: "Microsoft Office 2021 Professional Plus",
      price: 200,
      image: "./2021.png",
      description: "Installation service for Office 2021.",
    },
    {
      id: 3,
      name: "Vivo Y11 Software Recovery Service",
      price: 350,
      image: "./vivo y11 1906.jpeg",
      description: "Phone software troubleshooting service.",
    },
  ];

  const grid = document.getElementById("productGrid");

  function buildCard(p) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="thumb"><img src="${p.image}" /></div>
      <div class="card-body">
        <div class="title">${p.name}</div>
        <p class="desc">${p.description}</p>
        <div class="price">₱${p.price}</div>

        <div class="row">
          <label for="qty-${p.id}" style="font-size:13px;color:gray">Qty</label>
          <input id="qty-${p.id}" type="number" min="1" value="1">
        </div>

        <button class="buy" data-id="${p.id}">
          Buy — Message Seller
        </button>
      </div>
    `;

    return card;
  }

  products.forEach(p => grid.appendChild(buildCard(p)));

  grid.addEventListener("click", async (ev) => {
    const btn = ev.target.closest(".buy");
    if (!btn) return;

    const id = Number(btn.dataset.id);
    const product = products.find(p => p.id === id);
    if (!product) return;

    const qty = Math.max(
      1,
      parseInt(document.getElementById(`qty-${id}`).value || "1")
    );

    const message =
      `Hi! I'm interested in:\n\n` +
      `${product.name}\n` +
      `Price: ₱${product.price}\n` +
      `Qty: ${qty}`;

    // COPY MESSAGE
    try {
      await navigator.clipboard.writeText(message);
      alert("Message copied! Paste it in Messenger.");
    } catch (e) {
      alert("Copy failed. Please copy manually.");
    }

    // OPEN FACEBOOK APP (NOT MESSENGER DEEP LINK)
    const fbUrl = `https://www.facebook.com/profile.php?id=${FB_PAGE_ID}`;

    // this avoids Play Store loop
    window.location.href = fbUrl;
  });
</script>
  </body>
</html>
